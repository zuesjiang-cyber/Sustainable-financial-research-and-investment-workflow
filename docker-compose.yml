services:
  postgres:
    image: postgres:16-alpine
    container_name: fintrust-postgres
    restart: always
    environment:
      POSTGRES_DB: fintrust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fintrust_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintrust"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fintrust-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:fintrust_dev_password@postgres:5432/fintrust
      STORAGE_DIR: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/storage

volumes:
  pgdata:
  app_storage:
