  "components": {
    "securitySchemes": {
      "SessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "fintrust_session"
      }
    },
    "responses": {
      "Error": {
        "description": "Structured error; status code follows the error catalog in 09_API与事件契约.md",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ApiError"
            }
          }
        }
      }
    },
    "schemas": {
      "EvidenceBundle": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "documents",
          "spans",
          "facts",
          "calculations"
        ],
        "properties": {
          "documents": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/SourceDocument"
            }
          },
          "spans": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/EvidenceSpan"
            }
          },
          "facts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Fact"
            }
          },
          "calculations": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Calculation"
            }
          }
        }
      },
      "Outcome": {
        "type": "string",
        "enum": [
          "SUPPORTED",
          "PARTIALLY_SUPPORTED",
          "WEAKENED",
          "UNRESOLVED"
        ]
      },
      "RunStatus": {
        "type": "string",
        "enum": [
          "QUEUED",
          "RUNNING",
          "WAITING_USER",
          "AWAITING_REVIEW",
          "COMPLETED",
          "FAILED",
          "CANCELLED",
          "SUPERSEDED"
        ]
      },
      "RunKind": {
        "type": "string",
        "enum": [
          "INITIAL_REPORT",
          "ADD_REPORT",
          "REFRESH_FILINGS",
          "REVIEW_STATE"
        ]
      },
      "Phase": {
        "type": "string",
        "enum": [
          "PARSE_REPORT",
          "IDENTIFY_COMPANY",
          "EXTRACT_THESES",
          "DISCOVER_FILINGS",
          "EXTRACT_FACTS",
          "VERIFY",
          "BUILD_DIFF"
        ]
      },
      "Period": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "start": {
            "anyOf": [
              {
                "type": "string",
                "format": "date"
              },
              {
                "type": "null"
              }
            ]
          },
          "end": {
            "type": "string",
            "format": "date"
          },
          "basis": {
            "type": "string",
            "enum": [
              "YEAR",
              "YTD",
              "QUARTER",
              "INSTANT"
            ]
          }
        },
        "required": [
          "start",
          "end",
          "basis"
        ]
      },
      "Company": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "exchange": {
            "type": "string",
            "enum": [
              "SSE",
              "SZSE"
            ]
          },
          "securityCode": {
            "type": "string"
          },
          "issuerIds": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "aliases": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "id",
          "name",
          "exchange",
          "securityCode",
          "issuerIds",
          "aliases"
        ]
      },
      "Region": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "pageNumber": {
            "type": "integer",
            "minimum": 1
          },
          "bbox": {
            "type": "array",
            "items": {
              "type": "number",
              "minimum": 0,
              "maximum": 1
            },
            "minItems": 4,
            "maxItems": 4
          }
        },
        "required": [
          "pageNumber",
          "bbox"
        ]
      },
      "EvidenceSpan": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "documentId": {
            "type": "string",
            "format": "uuid"
          },
          "parseId": {
            "type": "string",
            "format": "uuid"
          },
          "regions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Region"
            }
          },
          "quote": {
            "type": "string"
          },
          "textHash": {
            "type": "string"
          },
          "headingPath": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "tableCell": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "tableId": {
                "type": "string"
              },
              "row": {
                "type": "integer",
                "minimum": 0
              },
              "col": {
                "type": "integer",
                "minimum": 0
              }
            },
            "required": [
              "tableId",
              "row",
              "col"
            ]
          },
          "quality": {
            "type": "string",
            "enum": [
              "NATIVE",
              "OCR_RELIABLE",
              "OCR_UNCERTAIN",
              "LEGACY"
            ]
          }
        },
        "required": [
          "id",
          "documentId",
          "parseId",
          "regions",
          "quote",
          "textHash",
          "headingPath",
          "quality"
        ]
      },
      "SourceDocument": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "role": {
            "type": "string",
            "enum": [
              "THESIS_SOURCE",
              "FINANCIAL_FILING",
              "SUPPLEMENT"
            ]
          },
          "title": {
            "type": "string"
          },
          "fileName": {
            "type": "string"
          },
          "mimeType": {
            "type": "string",
            "enum": [
              "application/pdf",
              "text/plain"
            ]
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "companyId": {
            "anyOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ]
          },
          "publishedAt": {
            "anyOf": [
              {
                "type": "string",
                "format": "date-time"
              },
              {
                "type": "null"
              }
            ]
          },
          "period": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Period"
              },
              {
                "type": "null"
              }
            ]
          },
          "origin": {
            "type": "string",
            "enum": [
              "USER_UPLOAD",
              "OFFICIAL_DISCLOSURE",
              "LEGACY_TEXT"
            ]
          },
          "officialUrl": {
            "anyOf": [
              {
                "type": "string",
                "format": "uri"
              },
              {
                "type": "null"
              }
            ]
          },
          "providerId": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "supersedesDocumentId": {
            "anyOf": [
              {
                "type": "string",
                "format": "uuid"
              },
              {
                "type": "null"
              }
            ]
          },
          "isSynthetic": {
            "type": "boolean"
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "id",
          "role",
          "title",
          "fileName",
          "mimeType",
          "sha256",
          "companyId",
          "publishedAt",
          "period",
          "origin",
          "officialUrl",
          "providerId",
          "supersedesDocumentId",
          "isSynthetic",
          "createdAt"
        ]
      },
      "CitedStatement": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "text": {
            "type": "string"
          },
          "evidenceIds": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "factIds": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "calculationIds": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          }
        },
        "required": [
          "text",
          "evidenceIds",
          "factIds",
          "calculationIds"
        ]
      },
      "ResearchQuestion": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "thesisId": {
            "type": "string",
            "format": "uuid"
          },
          "text": {
            "type": "string"
          },
          "requiredEvidence": {
            "type": "string"
          },
          "triggerPeriod": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Period"
              },
              {
                "type": "null"
              }
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "OPEN",
              "ANSWERED",
              "DEFERRED"
            ]
          },
          "answer": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/CitedStatement"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "id",
          "thesisId",
          "text",
          "requiredEvidence",
          "triggerPeriod",
          "status",
          "answer"
        ]
      },
      "Condition": {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "const": "COMPARE"
              },
              "metric": {
                "type": "string"
              },
              "op": {
                "type": "string",
                "enum": [
                  "GT",
                  "GTE",
                  "EQ",
                  "LTE",
                  "LT"
                ]
              },
              "target": {
                "type": "string",
                "pattern": "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
              },
              "unit": {
                "type": "string",
                "enum": [
                  "CURRENCY",
                  "RATIO",
                  "COUNT",
                  "CUSTOM"
                ]
              },
              "period": {
                "$ref": "#/components/schemas/Period"
              },
              "scope": {
                "type": "string",
                "enum": [
                  "CONSOLIDATED",
                  "PARENT",
                  "SEGMENT"
                ]
              },
              "segment": {
                "type": "string"
              },
              "origin": {
                "type": "string",
                "enum": [
                  "REPORT_EXPLICIT",
                  "SYSTEM_PROPOSED",
                  "USER_CONFIRMED"
                ]
              }
            },
            "required": [
              "kind",
              "metric",
              "op",
              "target",
              "unit",
              "period",
              "scope",
              "origin"
            ]
          },
          {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "kind": {
                "const": "TREND"
              },
              "metric": {
                "type": "string"
              },
              "direction": {
                "type": "string",
                "enum": [
                  "UP",
                  "DOWN",
                  "STABLE"
                ]
              },
              "period": {
                "$ref": "#/components/schemas/Period"
              },
              "comparePeriod": {
                "$ref": "#/components/schemas/Period"
              },
              "scope": {
                "type": "string",
                "enum": [
                  "CONSOLIDATED",
                  "PARENT",
                  "SEGMENT"
                ]
              },
              "tolerance": {
                "anyOf": [
                  {
                    "type": "string",
                    "pattern": "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
